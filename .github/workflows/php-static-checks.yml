name: PHP Static Checks

on:
  push:
    branches:
      - reporting-architecture-v1
  pull_request:
    branches:
      - main

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            echo "Linting $file"
            if ! php -l "$file"; then
              failed=1
            fi
          done < <(find . -type f -name '*.php' -print0)
          exit "$failed"

      - name: Check forbidden committed secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "config/database.php"
            "config/db.php"
            "opportunity-config/app.php"
            "opportunity-config/database.php"
            ".env"
          )
          for file in "${forbidden[@]}"; do
            if [ -e "$file" ]; then
              echo "Forbidden production secret/config file is committed: $file"
              exit 1
            fi
          done
